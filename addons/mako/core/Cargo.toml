[package]
name="peligames-mako"
version="0.1.0"
edition="2021"
license="GPL-3.0-only"
[dependencies]
peligames-addon-kit={path="../../_infra/sdk",default-features=false}
peligames-mod-config={path="../../_infra/shared/config"}
peligames-archive={path="../../_infra/shared/archive",default-features=false,features=["tar-xz"]}
peligames-mangohud-layers={path="../../_infra/shared/mangohud-layers"}
serde={version="1",features=["derive"]}
serde_json="1"
sha2="0.10"
uuid={version="1",features=["v4"]}
libc="0.2"
reqwest={version="0.13.5",default-features=false,features=["rustls","json"]}
walkdir="2"
tokio={version="1",features=["rt-multi-thread"]}
[dev-dependencies]
tokio={version="1",features=["macros"]}
tar="0.4"
xz2="0.1"
