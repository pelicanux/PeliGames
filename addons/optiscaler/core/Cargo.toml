[package]
name = "peligames-optiscaler"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-only"
description = "OptiScaler integration independent of the launcher runtime"

[dependencies]
peligames-addon-kit = {path="../../_infra/sdk",default-features=false}
peligames-mod-config = { path = "../../_infra/shared/config" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

peligames-archive = { path = "../../_infra/shared/archive" }
reqwest = { version="0.13.5", features=["json","rustls"] }
tokio = { version="1", features=["rt-multi-thread","sync"] }
zip = { version="0.6.6", default-features=false, features=["deflate"] }
