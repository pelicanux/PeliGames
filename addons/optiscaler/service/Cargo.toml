[package]
name = "peligames-optiscaler-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-only"

[dependencies]
peligames-addon-kit = { path = "../../_infra/sdk", default-features = false, features=["jobs"] }
peligames-optiscaler = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[dev-dependencies]
peligames-addon-kit = { path = "../../_infra/sdk", features = ["runtime"] }
tokio = { version = "1", features = ["rt", "macros"] }
