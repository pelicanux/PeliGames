[package]
name = "peligames-afmf"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-only"

[dependencies]
peligames-addon-kit={path="../../_infra/sdk",default-features=false}
peligames-archive={path="../../_infra/shared/archive",default-features=false,features=["tar-xz"]}
peligames-mangohud-layers={path="../../_infra/shared/mangohud-layers"}
reqwest={version="0.13.5",default-features=false,features=["json","rustls"]}
tokio={version="1",features=["rt-multi-thread"]}
sha2="0.10"
peligames-mod-config = { path = "../../_infra/shared/config" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
semver = "1"

[dev-dependencies]
tar="0.4"
xz2={version="0.1",features=["static"]}
