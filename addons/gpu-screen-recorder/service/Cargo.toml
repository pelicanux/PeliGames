[package]
name="peligames-capture-service"
version="0.1.0"
edition="2021"
license="GPL-3.0-only"
[dependencies]
peligames-gpu-screen-recorder={path="../core"}
peligames-addon-kit={path="../../_infra/sdk",default-features=false,features=["jobs"]}
peligames-mod-config={path="../../_infra/shared/config"}
serde_json="1"
serde={version="1",features=["derive"]}
tokio={version="1",features=["rt-multi-thread"]}
reqwest={version="0.13.5",default-features=false,features=["rustls"]}
base64="0.22"
