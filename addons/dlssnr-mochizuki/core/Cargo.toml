[package]
name="peligames-dlssnr-mochizuki"
version="0.1.0"
edition="2021"
license="GPL-3.0-only"
description="DLSSNR Mochizuki integration"
[dependencies]
peligames-mod-config={path="../../_infra/shared/config"}
serde={version="1",features=["derive"]}
sha2="0.10"
uuid={version="1",features=["v4"]}
walkdir="2"
flate2="1"
tar="0.4"
zip={version="0.6.6",default-features=false,features=["deflate"]}
reqwest={version="0.13.5",default-features=false,features=["json","rustls"]}
serde_json="1"
peligames-addon-kit={path="../../_infra/sdk",default-features=false}
tokio={version="1",features=["rt-multi-thread"]}
peligames-archive={path="../../_infra/shared/archive",default-features=false,features=["tar-gz"]}
