[package]
name="peligames-dlssnr-service"
version="0.1.0"
edition="2021"
license="GPL-3.0-only"
[dependencies]
peligames-dlssnr-mochizuki={path="../core"}
peligames-addon-kit={path="../../_infra/sdk",default-features=false,features=["jobs"]}
serde={version="1",features=["derive"]}
serde_json="1"
tokio={version="1",features=["rt-multi-thread"]}
[dev-dependencies]
peligames-addon-kit={path="../../_infra/sdk",features=["runtime"]}
tokio={version="1",features=["rt","macros"]}
