[package]
name="peligames-archive"
version="0.1.0"
edition="2021"
license="GPL-3.0-only"
[features]
default=["normalize"]
normalize=["dep:zip"]
tar-xz=["dep:tar","dep:xz2"]
tar-gz=["dep:tar","dep:flate2"]
[dependencies]
tar={version="0.4",optional=true}
xz2={version="0.1",features=["static"],optional=true}
zip={optional=true,version="0.6.6",default-features=false,features=["deflate"]}
flate2={version="1",optional=true}
