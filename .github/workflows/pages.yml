name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'public/welcome/*.jpg'
      - 'public/peligames.svg'
      - 'public/fonts/jersey-10/**'
      - 'public/fonts/oxanium/**'
      - 'public/launchers/lutris.svg'
      - 'public/launchers/faugus.svg'
      - '.github/workflows/pages.yml'
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'release' || !github.event.release.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public source
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble website and current downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/pelicanux/PeliGames/releases --paginate --slurp > "$RUNNER_TEMP/releases.json"
          node website/build.mjs --output "$RUNNER_TEMP/peligames-site" --releases "$RUNNER_TEMP/releases.json"
      - name: Upload public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/peligames-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
