<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matrix — PeliGames</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; color: #dce5ef; background: #080d16; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 50% 20%, #142436 0, #080d16 65%); }
    main { width: min(100%, 480px); padding: clamp(24px, 6vw, 44px); border: 1px solid #294258; border-radius: 22px; background: #0d1622; box-shadow: 0 24px 80px #0007, inset 0 1px 0 #ffffff09; text-align: center; }
    .brand { margin: 0 0 32px; font-size: 22px; font-weight: 800; letter-spacing: -.5px; color: #eef4fa; }
    .brand span { color: #69b9e4; }
    .status { width: 58px; height: 58px; margin: 0 auto 20px; display: grid; place-items: center; border-radius: 50%; border: 1px solid #377365; background: #16302d; color: #8ad5bd; }
    .status.error { border-color: #8e6943; background: #30271d; color: #e0b77c; }
    svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .service { display: block; margin: 0 0 12px; font: 14px ui-monospace, monospace; letter-spacing: 2px; color: #8ad5bd; }
    h1 { margin: 0 0 12px; color: #eef4fa; font-size: clamp(23px, 5vw, 28px); letter-spacing: -.6px; line-height: 1.2; }
    p { margin: 0; font-size: 16px; line-height: 1.6; overflow-wrap: anywhere; color: #bac9d8; }
    .next { margin-top: 24px; padding-top: 22px; border-top: 1px solid #243444; color: #91a6ba; font-size: 14px; }
  </style>
  <style>{{BRAND_STYLES}}</style>
</head>
<body>
  <main>
    {{BRAND_MARKUP}}
    <div class="status {{STATUS}}" aria-hidden="true"><svg viewBox="0 0 24 24">{{ICON}}</svg></div>
    <span class="service">MATRIX</span>
    <h1>{{TITLE}}</h1>
    <p>{{MESSAGE}}</p>
    <p class="next">{{NEXT}}</p>
  </main>
</body>
</html>
