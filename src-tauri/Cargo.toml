[package]
name = "peligames"
version = "0.5.2"
description = "A Tauri App"
authors = ["Pelicano"]
license = "GPL-3.0-only"
edition = "2021"
default-run = "peligames"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "peligames"
path = "src/main.rs"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "peligames_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tokio-stream = "0.1"
livekit = { version = "=0.9.5", features = ["rustls-tls-native-roots"] }
# Only to choose the process-wide TLS crypto backend (see run_mode).
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
nnnoiseless = { version = "=0.5.2", default-features = false }
cpal = "=0.15.3"
libloot = { version = "=0.29.6", default-features = false }
saphyr = "=0.0.6"
ico = "0.5.0"
png = "0.17.16"
libc = "0.2"
sha2 = "0.10.9"
md-5 = "0.10.6"
semver = "1.0.28"
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
uuid = { version = "1.26.1", features = ["v4"] }
# UDisks2 (drive automount) on the system D-Bus; already part of the tree through Tauri.
zbus = "5"
# Lutris game database (read-only), SQLite built in: no system tool needed.
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.13.5", features = ["json", "rustls", "form"] }
base64 = "0.22.1"
flate2 = "1.1.10"
xz2 = "0.1"
tar = "0.4.46"
urlencoding = "2.1.3"
dirs = "5.0"
walkdir = "2.4.0"
quick-xml = "0.41.0"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "sync", "time"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
webkit2gtk = { version = "2.0.2", features = ["v2_38"] }
