[package]
name = "peligames-launch-runtime"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# This executable runs inside Steam's runtime, independently of Tauri/WebKit.
[workspace]

[[bin]]
name = "pelirun"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
