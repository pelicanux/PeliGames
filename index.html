<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/peligames.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Loaded without blocking the first paint: offline or slow, the window still opens at once. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <title>PeliGames</title>
    <script>try { if (localStorage.getItem("peligames.appearance") === "light") document.documentElement.setAttribute("data-boot-light", ""); } catch {}</script>
    <style>
      /* Start screen: the window is transparent (rounded corners), so a solid panel
         covers it from the first frame until the interface replaces it. */
      .boot-splash { position: fixed; inset: 0; z-index: 2147483647; display: grid; place-items: center; align-content: center; gap: 20px; box-sizing: border-box; border: 1px solid rgba(255, 255, 255, .08); border-radius: 16px; background: radial-gradient(ellipse 60% 55% at 50% 42%, #171a28, #0e0f17 75%); }
      html[data-boot-light] .boot-splash { border-color: rgba(20, 24, 40, .1); background: radial-gradient(ellipse 60% 55% at 50% 42%, #ffffff, #eef0f6 75%); }
      .boot-splash img { width: 76px; height: 76px; animation: boot-splash-breathe 1.6s ease-in-out infinite; }
      .boot-splash i { display: block; width: 132px; height: 3px; border-radius: 999px; background: linear-gradient(90deg, transparent, #3b9bff, transparent) no-repeat; background-size: 45% 100%; animation: boot-splash-bar 1.15s ease-in-out infinite; }
      @keyframes boot-splash-breathe { 0%, 100% { opacity: .82; transform: scale(.96); } 50% { opacity: 1; transform: scale(1); } }
      @keyframes boot-splash-bar { from { background-position: -60% 0; } to { background-position: 160% 0; } }
      /* index.html's copy stays above the interface and fades out once it has drawn. */
      #boot-splash { transition: opacity .28s ease, visibility .28s; }
      #boot-splash.is-done { opacity: 0; visibility: hidden; }
      .boot-splash-message { max-width: 70%; margin: 0; color: #ff8a8a; font: 500 14px system-ui, sans-serif; text-align: center; }
      @media (prefers-reduced-motion: reduce) { .boot-splash img, .boot-splash i { animation: none; } }
    </style>
  </head>

  <body>
    <div id="boot-splash" class="boot-splash" role="status" aria-label="PeliGames"><img src="/peligames.svg" alt="" /><i></i></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
