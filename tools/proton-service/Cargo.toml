[package]
name = "peligames-proton-service"
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
ico = "0.5.0"
png = "0.17.16"
libc = "0.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
flate2 = "1.1.10"
xz2 = "0.1"
tar = "0.4.46"
dirs = "5.0"
uuid = { version = "1.26.1", features = ["v4"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }
